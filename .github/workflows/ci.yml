name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# شغل واحد بس لكل فرع/PR عشان ما نهدرش دقائق بناء متراكمة
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=100

      - name: Test
        run: npm run test

      - name: PII guard (ممنوع بيانات حقيقية في الريبو)
        run: node scripts/check-no-pii.mjs

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/index.html
          retention-days: 7
